<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#101728"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="200" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="1080" cy="180" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3b5c"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="card-shadow" x="-20" y="-20" width="620" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow-orange)"/>
  <rect width="1280" height="360" fill="url(#glow-cyan)"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1278" height="358" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  <!-- Chip: Category -->
  <g transform="translate(64, 48)">
    <rect width="250" height="28" rx="14" fill="#ff6b35" fill-opacity="0.12" stroke="#ff6b35" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#ff6b35"/>
    <text x="28" y="18" fill="#ff8c42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TURKISH PRICE ENGINE MCP</text>
  </g>

  <!-- Main Wordmark -->
  <text x="64" y="132" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
    akakce-mcp
  </text>

  <!-- Tagline -->
  <text x="64" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Model Context Protocol server for Akakçe (akakce.com).
  </text>
  <text x="64" y="194" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Live search, seller price comparisons, categories &amp; automated price alerts.
  </text>

  <!-- Interactive Terminal Chip -->
  <g transform="translate(64, 226)">
    <rect width="480" height="42" rx="8" fill="#131d31" stroke="#253553" stroke-width="1"/>
    <text x="16" y="26" fill="#00f2fe" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="13" font-weight="600">❯</text>
    <text x="36" y="26" fill="#f8fafc" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="13" font-weight="500">npx akakce-mcp auth</text>
    <text x="220" y="26" fill="#64748b" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="12"># or stdio server</text>
  </g>

  <!-- Feature Tags / Capabilities -->
  <g transform="translate(64, 296)">
    <!-- Badge 1 -->
    <rect width="128" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">⚡ 20 MCP Tools</text>

    <!-- Badge 2 -->
    <rect x="138" width="162" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="152" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🛡️ Akamai Defense Safe</text>

    <!-- Badge 3 -->
    <rect x="310" width="168" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="324" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🔑 Zero API Keys Req.</text>
  </g>

  <!-- ================= RIGHT COLUMN: TERMINAL CARD ================= -->
  <g transform="translate(640, 36)" filter="url(#card-shadow)">
    <!-- Terminal Background -->
    <rect width="576" height="288" rx="12" fill="#0f1624" stroke="#253552" stroke-width="1.2"/>

    <!-- Terminal Header / Titlebar -->
    <rect width="576" height="38" rx="12" fill="#151e32"/>
    <rect y="26" width="576" height="12" fill="#151e32"/>
    <!-- Window Dots -->
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="6" fill="#10b981"/>
    <!-- Title Text -->
    <text x="288" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">akakce-mcp — stdio session</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 62)" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="12">
      <!-- Call -->
      <text y="0" fill="#64748b">&gt; Claude Code Tool Call</text>
      <text y="22" fill="#38bdf8">akakce_search<tspan fill="#94a3b8">({ phrase: </tspan><tspan fill="#34d399">"pixel 8 mat"</tspan><tspan fill="#94a3b8"> })</tspan></text>

      <!-- Response Box -->
      <rect y="38" width="528" height="168" rx="6" fill="#090d16" stroke="#1a2538" stroke-width="1"/>
      <g transform="translate(16, 62)" font-size="11.5">
        <text y="0" fill="#10b981">✓ 200 OK — 44 products found across 18 verified stores</text>
        <text y="24" fill="#e2e8f0">• <tspan fill="#ffffff" font-weight="600">Umbos Pixel 8 Nano Mat (2-Pack)</tspan></text>
        <text y="42" fill="#94a3b8">  Price: <tspan fill="#34d399" font-weight="700">335,17 TL</tspan> · Free Shipping · Seller: <tspan fill="#38bdf8">PttAVM (ElsaStore)</tspan></text>

        <text y="68" fill="#e2e8f0">• <tspan fill="#ffffff" font-weight="600">Umbos Pixel 8 Nano Ultra-Slim Mat</tspan></text>
        <text y="86" fill="#94a3b8">  Price: <tspan fill="#34d399" font-weight="700">274,99 TL</tspan> · Fast Delivery · Seller: <tspan fill="#38bdf8">idefix</tspan></text>

        <text y="112" fill="#fbbf24">⚡ Price Alert: Target &lt; 300 TL active (Notification armed)</text>
      </g>
    </g>
  </g>
</svg>
